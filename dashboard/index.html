<!doctype html>
<html lang="en" data-theme="torus">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Torus BD Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Jost:wght@300;400&display=swap">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="torus-theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="app">
    <aside class="side" aria-label="Main">
      <div class="brand">
        <span class="brand-row"><svg class="brand-mark" viewBox="0 0 40 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="0.7"><ellipse cx="20" cy="12" rx="19" ry="4"/><ellipse cx="20" cy="12" rx="17" ry="6.5"/><ellipse cx="20" cy="12" rx="15" ry="9"/><ellipse cx="20" cy="12" rx="13" ry="11.3"/></g></svg><span class="wordmark">Torus</span></span><span class="tagline">Mind &amp; Medicine</span>
        <small>Business development</small>
      </div>
      <nav class="nav" data-nav></nav>
      <div class="side-foot">
        <p class="sample">Sample data · all names and numbers are fictional</p>
      </div>
    </aside>
    <main id="main" class="main" tabindex="-1">
      <header class="top">
        <div><div data-crumb></div><h1 data-title></h1><p class="muted" data-subtitle></p></div>
        <div class="top-actions" data-actions></div>
      </header>
      <div data-view></div>
    </main>
  </div>
  <div class="drawer" data-drawer hidden role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <div class="drawer-panel" data-drawer-panel></div>
  </div>
  <div class="toast" data-toast role="status" aria-live="polite" hidden></div>
  <script src="app.js"></script>
</body>
</html>
